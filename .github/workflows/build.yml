name: strongR-frida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:

# Needed so GITHUB_TOKEN can create releases and upload assets
permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            core.setOutput('FRIDA_VERSION', '17.19.0');

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}';
              const releaseResponse = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseVersion
              });
              const { data: { tag_name: ver } } = releaseResponse;
              if (ver == releaseVersion) {
                core.setOutput('ALREADY_RELEASE', '1');
              } else {
                core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if (e.status === 404 || e.message == 'Not Found') {
                core.setOutput('ALREADY_RELEASE', '0');
              } else {
                core.setFailed(e.message);
              }
            }

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE == '0'

    steps:
      # actions/create-release is archived and deprecated; use the gh CLI instead
      - name: Create Runner Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "strongR-frida build for Frida $VERSION" \
            --target "$GITHUB_SHA"

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: install dependencies
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief graphlib

      - name: build frida for Android
        shell: bash
        env:
          VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://github.com/hzzheyang/strongR-frida.git Patchs
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          git clone --recurse-submodules https://github.com/frida/frida
          cd frida
          git checkout tags/$VERSION
          cd frida
          for path in ../Patchs/strongR-frida/*
          do
            name=$(basename $path)
            real=$(realpath $path)
            echo "Apply patches in $real to frida/subprojects/$name"
            cd subprojects/$name
            git am ../../../Patchs/strongR-frida/$name/*.patch
            cd ../..
          done
          cd ..

          ARCHES="android-arm android-arm64 android-x86 android-x86_64"
          for ARCH in $ARCHES
          do
            mkdir build-$ARCH
            cd build-$ARCH
            ../frida/configure --host=$ARCH
            make
            cd ..
          done

      # Replaces the 12 separate actions/upload-release-asset steps
      # (that action is archived/deprecated and had typos in two of the steps)
      - name: Package and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          mkdir -p dist
          for ARCH in arm arm64 x86 x86_64
          do
            CORE="build-android-$ARCH/subprojects/frida-core"
            gzip -c "$CORE/server/frida-server"       > "dist/hluda-server-$VERSION-android-$ARCH.gz"
            gzip -c "$CORE/inject/frida-inject"       > "dist/hluda-inject-$VERSION-android-$ARCH.gz"
            gzip -c "$CORE/lib/gadget/frida-gadget.so" > "dist/hluda-gadget-$VERSION-android-$ARCH.so.gz"
          done
          ls -la dist
          gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
