#!/usr/bin/env bash
# Downloads all release assets for a specific tag of
# hzzheyang/strongR-frida-android from GitHub.
#
# Usage:
#   ./download-strongr-frida.sh                # downloads tag 17.19.0 by default
#   ./download-strongr-frida.sh 17.19.0         # explicit tag
#   ./download-strongr-frida.sh latest          # downloads the latest release instead

set -euo pipefail

REPO="hzzheyang/strongR-frida-android"
TAG="${1:-17.19.0}"
OUT_DIR="./${TAG}"

mkdir -p "$OUT_DIR"

if [ "$TAG" = "latest" ]; then
  API_URL="https://api.github.com/repos/${REPO}/releases/latest"
else
  API_URL="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
fi

echo "Fetching release metadata from: $API_URL"

JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" "$API_URL")"

# Extract asset download URLs and names without requiring jq (falls back to it if present)
if command -v jq >/dev/null 2>&1; then
  mapfile -t ASSET_URLS < <(echo "$JSON" | jq -r '.assets[].browser_download_url')
else
  mapfile -t ASSET_URLS < <(echo "$JSON" | grep -o '"browser_download_url": *"[^"]*"' | sed -E 's/.*"([^"]+)"$/\1/')
fi

if [ "${#ASSET_URLS[@]}" -eq 0 ]; then
  echo "No assets found for tag '$TAG'. Check that the tag exists:"
  echo "  https://github.com/${REPO}/releases/tag/${TAG}"
  exit 1
fi

echo "Found ${#ASSET_URLS[@]} asset(s). Downloading into: $OUT_DIR"

for url in "${ASSET_URLS[@]}"; do
  fname="$(basename "$url")"
  echo "  -> $fname"
  curl -fsSL -o "${OUT_DIR}/${fname}" "$url"
done

echo "Done. Files saved to ${OUT_DIR}/"
ls -la "$OUT_DIR"
